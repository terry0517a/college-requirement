name: pipeline

on:
  schedule:
    - cron: "0 3 * * 1"   # hipo, weekly Monday
    - cron: "0 4 * * 2"   # openalex, weekly Tuesday
    - cron: "0 5 * * 3"   # uac, weekly Wednesday
    - cron: "0 6 * * 4"   # scorecard, weekly Thursday
    - cron: "0 3 * * 5"   # cac_sieve, weekly Friday
    - cron: "0 3 * * 6"   # cac_rules, weekly Saturday
  workflow_dispatch:
    inputs:
      job:
        description: "Pipeline job to run"
        type: choice
        required: true
        options:
          - hipo
          - uac
          - openalex
          - scorecard
          - cac_sieve
          - cac_rules
      max_schools:
        description: "cac jobs only: schools per run (default 10)"
        type: string
        required: false
      time_budget_minutes:
        description: "cac jobs only: minutes before the run stops starting new schools (default 75)"
        type: string
        required: false

permissions:
  issues: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pipeline
      cancel-in-progress: false
    steps:
      - name: Resolve job name
        id: job
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            JOB="$INPUT_JOB"
          else
            case "$SCHEDULE" in
              "0 3 * * 1") JOB=hipo ;;
              "0 4 * * 2") JOB=openalex ;;
              "0 5 * * 3") JOB=uac ;;
              "0 6 * * 4") JOB=scorecard ;;
              "0 3 * * 5") JOB=cac_sieve ;;
              "0 3 * * 6") JOB=cac_rules ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: pipeline
        run: uv sync
      - name: Run pipeline job
        working-directory: pipeline
        env:
          JOB: ${{ steps.job.outputs.job }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
          CAC_MAX_SCHOOLS: ${{ github.event.inputs.max_schools }}
          CAC_TIME_BUDGET_MINUTES: ${{ github.event.inputs.time_budget_minutes }}
        run: uv run collegedata run "$JOB"
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          JOB: ${{ steps.job.outputs.job }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const job = process.env.JOB || 'unknown';
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[pipeline] ${job} failed on ${date}`,
              body: `The pipeline job \`${job}\` failed (job name: ${job}, trigger: ${context.eventName}).\n\nRun: ${process.env.RUN_URL}`,
              assignees: [context.repo.owner],
              labels: ['pipeline-failure'],
            });
