[project]
name = "collegedata"
version = "0.1.0"
description = "Public admission data pipeline for the university-information website"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pypdf>=5",
]

[project.scripts]
collegedata = "collegedata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collegedata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
